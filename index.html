<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Границы мира</title>
<style>
:root{--bg:#0d1520;--pan:#141f2e;--pan2:#1b2a3d;--ln:#2b3f57;--gold:#d9b25a;--tx:#e6ecf3;--mu:#8fa3b8;--red:#c0504d;--grn:#5fa86a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
#hdr{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 12px;background:linear-gradient(#111c2bf2,#111c2bcc);border-bottom:1px solid var(--ln);z-index:5}
#logo{font-weight:800;letter-spacing:.12em;color:var(--gold);white-space:nowrap}
.tabs{display:flex;gap:4px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--pan2);border:1px solid var(--ln);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}button.on{background:#3a2f14;border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
#clock{display:none;align-items:center;gap:6px;margin-left:auto}
#clock.show{display:flex}#date{font-weight:700;min-width:140px;text-align:right;color:var(--gold)}
.panel{position:absolute;top:54px;bottom:62px;width:292px;background:#101a28ea;border:1px solid var(--ln);border-radius:10px;padding:10px;overflow:auto;z-index:4}
#left{left:8px}#right{right:8px;width:276px;bottom:auto;max-height:calc(100% - 130px)}
#right:empty,#right.empty{display:none}
h3{margin:2px 0 8px;font-size:14px;color:var(--gold)}h4{margin:12px 0 6px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.note{color:var(--mu);font-size:12px}.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
#ftr{position:absolute;left:8px;right:8px;bottom:8px;height:46px;background:#101a28ea;border:1px solid var(--ln);border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:4}
#ftr input[type=range]{flex:1;accent-color:var(--gold)}
#ftrlab{min-width:150px;font-weight:700;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer}
.it:hover{background:var(--pan2)}.it img{width:28px;height:21px;border-radius:2px;border:1px solid #0008;flex:none}
.it .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .c{color:var(--mu);font-size:11px}
.flagbig{width:96px;height:72px;border:1px solid #000a;border-radius:3px;box-shadow:0 2px 8px #0008}
#tip{position:absolute;pointer-events:none;background:#0b121bf0;border:1px solid var(--ln);border-radius:8px;padding:5px 8px;font-size:12px;z-index:9;display:none;white-space:nowrap}
#tip img{width:22px;height:16px;vertical-align:-3px;margin-right:5px}
.log{font-size:11.5px;color:#c4d0dc;max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:2px}.log b{color:var(--gold);font-weight:600}
input[type=text]{background:#0b121b;border:1px solid var(--ln);border-radius:6px;padding:5px 8px;width:100%}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--ln);background:none}
select{background:#0b121b;border:1px solid var(--ln);border-radius:6px;padding:4px 6px;max-width:100%}
.zoom{position:absolute;right:300px;bottom:64px;display:flex;flex-direction:column;gap:4px;z-index:4}
.zoom button{width:32px;height:32px;padding:0;font-size:18px}
.danger{border-color:#7a2f2d}.go{border-color:#3d7a48}
.big{padding:8px 12px;font-weight:700}
#msg{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#2a1d0aee;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:10px;z-index:10;display:none;font-weight:600;max-width:60%;text-align:center}
#loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;font-size:18px;color:var(--gold)}
@media(max-width:900px){.panel{width:230px}#right{width:220px}.zoom{right:240px}#logo{display:none}}
</style></head><body>
<canvas id="map"></canvas>
<div id="hdr"><div id="logo">ГРАНИЦЫ МИРА</div>
 <div class="tabs"><button data-m="history" class="on">📜 История</button><button data-m="war">⚔ Война</button><button data-m="edit">✎ Редактор</button></div>
 <div id="clock"><span id="date"></span><button id="bPause" title="Пауза / Пуск (пробел)">⏸</button><button data-sp="0">1×</button><button data-sp="1">2×</button><button data-sp="2">4×</button><button data-sp="3">10×</button><button data-sp="4">30×</button></div>
</div>
<div id="left" class="panel"></div>
<div id="right" class="panel empty"></div>
<div class="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zf" title="Весь мир" style="font-size:14px">⌂</button></div>
<div id="ftr"></div>
<div id="tip"></div><div id="msg"></div>
<div id="loading">Загружаю карты и флаги…</div>

  for(const[b,d]of dmg)b.n-=d;}

 // retreat

 if(G.day%2===0)pushSnap();

}
function aiOrders(c){const W=G.W;const foes=new Set();for(const w of G.wars){if(w[0]===c)foes.add(w[1]);else if(w[1]===c)foes.add(w[0]);}

 for(const a of mine){
  const seen=new Map([[a.p,0]]);const q=[a.p];let best=-1,bs=-1e9;
  for(let h=0;h<q.length;h++){const u=q[h];const d=seen.get(u);if(d>=4)continue;for(const[v,t]of W.adj[u]){if(seen.has(v)||!allowed(c,v))continue;seen.set(v,d+1);q.push(v);

   if(o===G.N&&G.cnt[c]<40)sc=1.2-(d+1)*0.2;

 // pick a visual anchor inside shape
 P2.forEach(p=>{const c=document.createElement('canvas').getContext('2d');let best=null;for(let t=0;t<80;t++){const x=p.bb[0]+(p.bb[2]-p.bb[0])*(.5+(Math.random()-.5)*(t/80)),y=p.bb[1]+(p.bb[3]-p.bb[1])*(.5+(Math.random()-.5)*(t/80));if(c.isPointInPath(p.path,x,y)){best=[x,y];break;}}if(best){p.ax=best[0];p.ay=best[1];}});
 const links=[];for(let a=0;a<P2.length;a++)for(let b=a+1;b<P2.length;b++){const A=P2[a].bb,B=P2[b].bb;if(A[0]>B[2]+.4||B[0]>A[2]+.4||A[1]>B[3]+.4||B[1]>A[3]+.4)continue;let best=1e9;for(const r1 of P2[a].rings)for(let i=0;i<r1.pts.length;i+=4)for(const r2 of P2[b].rings)for(let k=0;k<r2.pts.length;k+=4){const d=Math.hypot(r1.pts[i]-r2.pts[k],r1.pts[i+1]-r2.pts[k+1]);if(d<best)best=d;}if(best<0.6)links.push([a,b,0]);else if(best<3)links.push([a,b,1]);}
 const W=finishWorld({y:G?G.y:2026,owners:O2.map(o=>({id:o[0],ru:o[1],flag:o[2],color:o[3],cap:o[4]})),prov:P2,links});
 HW=W;const gg=newGame(W,HI);gg.y=G?G.y:2026;gg.historic=false;G=gg;G.C.forEach(c=>{c.spec=genSpec(c.ru);});G.metas=[mkMeta(G)];G.hist=[];pushSnapG(G);brush=-1;fitWorld();stale();msg(`${name}: загружено ${P2.length} стран.`);setMode('edit');}
function updClock(){if(!G)return;$('date').textContent=dateStr(G.day);$('bPause').textContent=G.running?'⏸':'▶';document.querySelectorAll('#clock [data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===G.speed));}
function updFooter(light){
 if(mode==='history'||!G){const n=DATA.snaps.length;if(light)return;FT.innerHTML=`<span id="ftrlab">${HW.y===2026?'Сегодня':HW.y}</span><input type="range" id="era" min="0" max="${n-1}" value="${HI}" step="1"><span class="note" style="white-space:nowrap">${DATA.snaps.map(s=>s.y).join(' · ')}</span>`;
  $('era').oninput=e=>{if(histTimer)togglePlayHist();const i=+e.target.value;if(i!==HI)setEra(i);};return;}
 const last=G.hist[G.hist.length-1].day;
 if(!$('rew')||light!==true){FT.innerHTML=`<span id="ftrlab">◀ Назад во времени</span><input type="range" id="rew" min="0" max="${Math.max(1,last)}" value="${G.day}" step="1"><span class="note" id="rewd" style="min-width:120px;text-align:right"></span>`;
  $('rew').oninput=e=>{G.running=false;updClock();const d=+e.target.value;let bi=0;for(let i=0;i<G.hist.length;i++){if(G.hist[i].day<=d)bi=i;else break;}restore(bi);$('rewd').textContent=dateStr(G.day);updClock();dirty=1;};}
 else{const r=$('rew');r.max=Math.max(1,last);r.value=G.day;}
 $('rewd').textContent=(G.hi<G.hist.length-1?'⏪ ':'')+dateStr(G.day);}
function updInfo(){
 const W=curW();let h='';
 if(selProv>=0){const pr=W.prov[selProv];const own=curOwner()[selProv],c=curC()[own];
  h+=`<div class="row">${imgTag(c,'flagbig')}<div><b style="font-size:14px">${esc(c.ru)}</b><div class="note">${esc(pr.name)}</div>${c.flag==='_de_nazi'?'<div class="note">символика скрыта размытием</div>':''}</div></div>`;
  if(mode==='history'){let cnt=0,ar=0;curOwner().forEach((o,i)=>{if(o===own){cnt++;ar+=W.prov[i].area;}});h+=`<div class="note">Провинций у державы: ${cnt}<br>Площадь ≈ ${Math.round(ar*110/1000)} млн км²<br>Столица: ${esc(W.prov[c.cap]?.name||'—')}</div>`;}
  else if(G){const here=G.armies.filter(a=>a.p===selProv);const mine=selArmies();
   h+=`<div class="note">Армий здесь: ${here.length}${here.length?' ('+Array.from(new Set(here.map(a=>G.C[a.c].ru))).join(', ')+')':''}<br>Провинций у страны: ${G.cnt[own]}</div>`;
   if(mode==='war'&&G.player>=0){const me=G.player;
    if(own===me){h+=`<div class="row"><button id="bRec" class="go" ${G.C[me].man<10?'disabled':''}>＋ Нанять армию (10)</button></div>`;}
    else if(own!==G.N){if(atWar(me,own))h+=`<div class="row"><button id="bPeace">🕊 Предложить мир</button></div>`;else h+=`<div class="row"><button id="bWar" class="danger">⚔ Объявить войну</button></div>`;}
    if(mine.length)h+=`<div class="row"><button id="bGo" class="go">➜ Выбрано армий: ${mine.length}</button></div><div class="note">Выберите другую провинцию и нажмите ПКМ (или «Идти сюда»).</div>`;}
   else if(mode==='war'&&G.player<0&&own!==G.N){h+=`<div class="row"><button id="bPlay" class="go big">▶ Играть за ${esc(c.ru)}</button></div>`;}}
 }else if(selOwner>=0){const c=curC()[selOwner];h+=`<div class="row">${imgTag(c,'flagbig')}<div><b>${esc(c.ru)}</b></div></div>`;}
 RP.innerHTML=h;RP.classList.toggle('empty',!h);
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
 on('bRec',()=>{const c=G.C[G.player];if(c.man>=10&&G.owner[selProv]===G.player){spawn(G.player,selProv,10);c.man-=10;pushSnap(true);dirty=1;updInfo();updPanels();}});
 on('bWar',()=>{declareWar(G.player,G.owner[selProv]);updInfo();});
 on('bPeace',()=>{proposePeace(G.owner[selProv]);updInfo();});
 on('bPlay',()=>{G.player=G.owner[selProv];G.over=false;zoomOwner(G.player);msg(`Вы играете за ${G.C[G.player].ru}. Нажмите ▶ для старта времени.`,4000);updPanels();updInfo();});
 on('bGo',()=>{});}
// ---------- input ----------
let drag=null,painting=false,moved=false;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);if(e.button===2)return;drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};moved=false;
 if(mode==='edit'&&tool==='paint'&&G){painting=true;paintAt(e.clientX,e.clientY);}});
cv.addEventListener('pointermove',e=>{
 if(drag&&!painting){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){cv.classList.add('drag');view.tx=drag.tx+dx;view.ty=drag.ty+dy;clampView();dirty=1;}}
 else if(painting){paintAt(e.clientX,e.clientY);}
 else{const p=pick(e.clientX,e.clientY);if(p!==hoverProv){hoverProv=p;dirty=1;}const t=$('tip');if(p>=0){const W=curW(),c=curC()[curOwner()[p]];t.innerHTML=`<img src="${flagURL(c)}">${esc(c.ru)} · ${esc(W.prov[p].name)}`;t.style.display='block';t.style.left=Math.min(e.clientX+14,VW-260)+'px';t.style.top=(e.clientY+16)+'px';}else t.style.display='none';}});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');const wasPaint=painting;painting=false;if(wasPaint){pushSnap(true);updInfo();updPanels();}
 if(drag&&!moved&&e.button===0&&!wasPaint)clickAt(e.clientX,e.clientY);drag=null;});
cv.addEventListener('pointerleave',()=>{$('tip').style.display='none';hoverProv=-1;dirty=1;});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(mode==='war'&&G&&G.player>=0){const p=pick(e.clientX,e.clientY);if(p>=0)orderTo(p);}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.25:0.8);},{passive:false});
function orderTo(p){const arm=selArmies();if(!arm.length){msg('Сначала выберите провинцию со своими армиями (ЛКМ).');return;}let ok=0;for(const a of arm){if(a.p===p)continue;a.dest=p;a.to=-1;a.prog=0;ok++;}if(ok){const o=G.owner[p];if(o!==G.player&&o!==G.N&&!atWar(G.player,o))msg(`Чтобы атаковать ${G.C[o].ru}, нужно объявить войну — армии пойдут к границе.`,3200);dirty=1;}}
function paintAt(x,y){const p=pick(x,y);if(p<0||brush<0)return;if(G.owner[p]!==brush){setOwner(p,brush,true);dirty=1;}}
function clickAt(x,y){const p=pick(x,y);
 if(mode==='edit'){if(tool==='pick'&&p>=0){brush=G.owner[p];tool='paint';panelEdit();return;}if(tool==='paint')return;}
 selProv=p;selOwner=p>=0?curOwner()[p]:-1;
 if(mode==='war'&&G&&G.player<0&&p>=0&&G.owner[p]!==G.N){}
 dirty=1;updInfo();if(mode==='edit'&&selOwner>=0&&tool==='select'){}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#clock [data-sp]').forEach(b=>b.onclick=()=>{G.speed=+b.dataset.sp;if(!G.running)toggleRun();updClock();});
function toggleRun(){if(!G)return;if(G.over&&G.player>=0&&!G.running){msg('Страна пала — перемотайте время назад или выберите другую страну.');}G.running=!G.running;G.last=0;G.acc=0;updClock();}
$('bPause').onclick=toggleRun;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();if(mode!=='history')toggleRun();}if(e.key==='+')zoomAt(VW/2,VH/2,1.3);if(e.key==='-')zoomAt(VW/2,VH/2,.77);});
$('zi').onclick=()=>zoomAt(VW/2,VH/2,1.4);$('zo').onclick=()=>zoomAt(VW/2,VH/2,.7);$('zf').onclick=fitWorld;
addEventListener('resize',()=>{resize();clampView();});
// pinch
const ptrs=new Map();let pinch0=0;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch0)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pinch0);pinch0=d;moved=true;}});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;});
// ---------- boot ----------
(async function(){
 const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
 DATA=JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
 resize();HI=DATA.snaps.findIndex(s=>s.y===1938);HW=getWorld(HI);fitWorld();setMode('history');$('loading').remove();loop();
 window.__dbg={get G(){return G},setEra,startGame,setMode,simStep,view,zoomOwner,declareWar,get HI(){return HI},fitWorld,restore,toggleRun,selectProv:p=>{selProv=p;selOwner=curOwner()[p];dirty=1;updInfo();}};
})();
</script></body></html>
